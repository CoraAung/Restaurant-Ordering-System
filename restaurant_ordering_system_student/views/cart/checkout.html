<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - Member View</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/feedback.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">Restaurant Ordering System</a>
        <div class="navbar-nav ms-auto align-items-center">
          <a href="/member/cart/retrieve/all" class="btn btn-outline-light btn-sm me-2">🛒 Cart</a>
          <span class="navbar-text me-3">Welcome, Member</span>
          <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
      </div>
    </nav>

    <main class="container mt-4">
      <div class="mb-3">
        <a href="/member/cart/retrieve/all" class="btn btn-outline-secondary btn-sm">
          ← Back to Cart
        </a>
      </div>

      <div id="error-message" class="alert alert-danger" style="display: none"></div>
      <div id="success-message" class="alert alert-success" style="display: none"></div>

      <div class="card mx-auto" style="max-width: 500px;">
        <div class="card-body">
          <h4 class="card-title text-center mb-4">Checkout</h4>

          <p id="loading-message" class="text-center">Loading checkout summary...</p>

          <div id="checkout-content" style="display: none">
            <!-- Order items -->
            <div id="checkout-items"></div>

            <hr>

            <!-- Price breakdown -->
            <div class="d-flex justify-content-between mb-2">
              <span>Subtotal</span>
              <span id="checkout-subtotal">$0.00</span>
            </div>

            <div id="checkout-discounts-list"></div>

            <div class="d-flex justify-content-between mb-2">
              <span>Delivery Fee</span>
              <span id="checkout-delivery-fee">$0.00</span>
            </div>

            <hr>

            <div class="d-flex justify-content-between mb-4 fw-bold fs-5">
              <span>Total</span>
              <span id="checkout-total">$0.00</span>
            </div>

            <div class="text-end">
              <button id="placeOrderBtn" class="btn btn-dark">Place Order</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/checkout.js"></script>
  </body>
</html>
