<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add to Cart - Member View</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/feedback.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">Restaurant Ordering System</a>
        <div class="navbar-nav ms-auto align-items-center">
          <span class="navbar-text me-3">Welcome, Member</span>
          <a
            href="/member/cart/retrieve/all"
            class="btn btn-outline-light btn-sm me-2"
            >🛒 Cart</a
          >
          <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
      </div>
    </nav>

    <main class="container mt-4">
      <div class="mb-3">
        <a id="backToProductBtn" href="/member/products" class="btn btn-outline-secondary btn-sm">
          ← Back to Products
        </a>
      </div>

      <div id="error-message" class="alert alert-danger" style="display: none"></div>
      <div id="success-message" class="alert alert-success" style="display: none"></div>

      <div class="feedback-form-box">
        <h4 id="formTitle" class="feedback-form-title">Add Cart Items</h4>

        <form id="addCartItemForm">
          <div class="row align-items-start">
            <div class="col-md-3 mb-3">
              <label for="productId" class="form-label fw-bold">Product Id</label>
              <input type="text" id="productId" class="form-control" readonly />
            </div>

            <div class="col-md-3 mb-3">
              <label for="quantity" class="form-label fw-bold">Quantity</label>
              <input type="number" id="quantity" class="form-control" min="1" required />
            </div>
          </div>

          <button type="submit" class="btn btn-dark btn-sm">Add</button>
        </form>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/cart-create.js"></script>
  </body>
</html>
