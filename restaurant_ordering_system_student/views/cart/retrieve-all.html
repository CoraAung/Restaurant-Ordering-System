<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart - Member View</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/feedback.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">Restaurant Ordering System</a>
        <div class="navbar-nav ms-auto align-items-center">
          <span class="navbar-text me-3">Welcome, Member</span>
          <a
            href="/member/cart/retrieve/all"
            class="btn btn-outline-light btn-sm me-2"
            >🛒 Cart</a
          >
          <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
      </div>
    </nav>

    <main class="container mt-4">
      <div class="mb-3">
        <a href="/member/products" class="btn btn-outline-secondary btn-sm">
          ← Back to Products
        </a>
      </div>

      <div
        id="error-message"
        class="alert alert-danger"
        style="display: none"
      ></div>
      <div
        id="success-message"
        class="alert alert-success"
        style="display: none"
      ></div>

      <div class="card">
        <div class="card-body">
          <h4 class="card-title mb-4">Shopping Cart</h4>

          <p id="loading-message" class="text-center">Loading cart...</p>

          <p
            id="empty-message"
            class="text-center fw-bold"
            style="display: none"
          >
            Your cart is empty.
          </p>

          <div
            id="cart-table-container"
            class="table-responsive"
            style="display: none"
          >
            <table class="table table-striped align-middle">
              <thead>
                <tr>
                  <th>Product Description</th>
                  <th>Sub-total Price</th>
                  <th>Unit Price</th>
                  <th>Quantity</th>
                  <th>Update Quantity</th>
                  <th>Delete Item</th>
                </tr>
              </thead>
              <tbody id="cart-items-tbody">
                <!-- Cart items populated by JavaScript -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Cart Summary - now a separate, standalone card -->
      <div
        id="cart-summary-box"
        class="card mt-4"
        style="display: none; max-width: 320px; margin: 0 auto"
      >
        <div class="card-body text-center">
          <h5 class="card-title mb-3">Cart Summary</h5>
          <p class="mb-1">
            Total Quantity: <span id="summary-total-quantity">0</span>
          </p>
          <p class="mb-3">
            Total Checkout Price: $<span id="summary-total-price">0.00</span>
          </p>

          <button id="checkoutBtn" class="btn btn-dark w-100">Checkout</button>
        </div>
      </div>

      <!-- Update Quantity Form -->
      <div
        id="updateQuantityBox"
        class="feedback-form-box mt-4"
        style="display: none"
      >
        <h4 class="feedback-form-title">Update Quantity</h4>

        <form id="updateQuantityForm">
          <div class="mb-3">
            <label for="updateCartItemId" class="form-label fw-bold"
              >Cart Item ID</label
            >
            <input
              type="text"
              id="updateCartItemId"
              class="form-control"
              readonly
            />
          </div>

          <div class="mb-3">
            <label for="updateQuantity" class="form-label fw-bold"
              >New Quantity</label
            >
            <input
              type="number"
              id="updateQuantity"
              class="form-control"
              min="1"
              required
            />
          </div>

          <button type="submit" class="btn btn-dark btn-sm">Update</button>
          <button
            type="button"
            class="btn btn-secondary btn-sm"
            onclick="cancelUpdateQuantity()"
          >
            Cancel
          </button>
        </form>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/cart-retrieve.js"></script>
  </body>
</html>
