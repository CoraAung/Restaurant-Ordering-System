<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details - Member View</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Your custom CSS -->
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/feedback.css" />
  </head>
  <body>
    <!-- Navigation Bar (identical to products.html) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">Restaurant Ordering System</a>
        <div class="navbar-nav ms-auto align-items-center">
          <span class="navbar-text me-3">Welcome, Member</span>
          <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container mt-4">
      <!-- Back Button -->
      <div class="mb-3">
        <a id="backToProductBtn" href="/member/products" class="btn btn-outline-secondary btn-sm">
          ← Back to Products
        </a>
      </div>

      <!-- Error / Success Messages -->
      <div
        id="error-message"
        class="alert alert-danger"
        style="display: none"
      ></div>
      <div
        id="success-message"
        class="alert alert-success"
        style="display: none"
      ></div>

      <!-- Create Feedback Form -->
      
<div class="feedback-form-box">
  <h4 id="formTitle" class="feedback-form-title">
    Create Feedback
  </h4>

          <form id="createFeedbackForm">
            <div class="row align-items-start">
              <!-- Product ID -->
              <div class="col-md-3 mb-3">
                <label for="productId" class="form-label fw-bold"
                  >Product ID</label
                >
                <input
                  type="text"
                  id="productId"
                  class="form-control"
                  readonly
                />
              </div>

              <!-- Rating -->
              <div class="col-md-3 mb-3">
                <label for="rating" class="form-label fw-bold">Rating</label>
                <input
                  type="number"
                  id="rating"
                  class="form-control"
                  min="1"
                  max="5"
                  required
                />
              </div>

              <!-- Comment Text -->
              <div class="col-md-6 mb-3">
                <label for="commentText" class="form-label fw-bold"
                  >Comment Text</label
                >
                <textarea
                  id="commentText"
                  class="form-control"
                  rows="2"
                  required
                ></textarea>
              </div>
            </div>

            <button type="submit" class="btn btn-dark btn-sm">Create</button>
          </form>
        </div>
      </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/feedback-create.js"></script>
  </body>
</html>
