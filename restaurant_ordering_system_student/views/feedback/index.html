<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Feedback - Member View</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Global CSS -->
    <link rel="stylesheet" href="/css/style.css" />

    <!-- Feedback CSS -->
    <link rel="stylesheet" href="/css/feedback.css" />
  </head>

  <body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">Restaurant Ordering System</a>

        <div class="navbar-nav ms-auto align-items-center">
          <span class="navbar-text me-3">Welcome, Member</span>
          <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container mt-4">
      <!-- Back Button -->
      <div class="mb-4">
        <a href="/member/products" class="btn btn-outline-secondary btn-sm">
          ← Back to Products
        </a>
      </div>

      <!-- Error / Success Messages -->
      <div
        id="error-message"
        class="alert alert-danger"
        style="display: none"
      ></div>

      <div
        id="success-message"
        class="alert alert-success"
        style="display: none"
      ></div>

      <!-- Feedback List Box -->
      <div class="feedback-form-box feedback-list-box">
        <h4 class="feedback-form-title">
          Retrieve All My Feedback
        </h4>

        <p id="feedback-count" class="text-center fw-bold">
          Total Feedback: 0
        </p>

        <p id="loading-message" class="text-center">
          Loading feedback...
        </p>

        <p
          id="empty-message"
          class="text-center fw-bold"
          style="display: none"
        >
          You have not submitted any feedback yet.
        </p>

        <div id="feedbackList"></div>
      </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Feedback Index JS -->
    <script src="/js/feedback-index.js"></script>
  </body>
</html>
