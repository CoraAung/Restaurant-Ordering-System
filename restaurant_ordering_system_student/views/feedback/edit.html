<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details - Member View</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Your custom CSS -->
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/feedback.css" />
  </head>
  <body>
    <!-- Navigation Bar (identical to products.html) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">Restaurant Ordering System</a>
        <div class="navbar-nav ms-auto align-items-center">
          <span class="navbar-text me-3">Welcome, Member</span>
          <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container mt-4">
      <!-- Back Button -->
      <div class="mb-3">
        <a href="/member/feedback" class="btn btn-outline-secondary btn-sm">
          ← Back to My Feedback
        </a>
      </div>

      <!-- Error / Success Messages -->
      <div
        id="error-message"
        class="alert alert-danger"
        style="display: none"
      ></div>

      <div
        id="success-message"
        class="alert alert-success"
        style="display: none"
      ></div>

      <!-- Update Feedback Form -->
      <div class="feedback-form-box">
        <h4 id="formTitle" class="feedback-form-title">Update Feedback</h4>

        <form id="updateFeedbackForm">
          <div class="row align-items-start">
            <!-- Feedback ID -->
            <div class="col-md-3 mb-3">
              <label for="feedbackId" class="form-label fw-bold">
                Feedback ID
              </label>

              <input
                type="text"
                id="feedbackId"
                class="form-control"
                readonly
              />
            </div>

            <!-- Rating -->
            <div class="col-md-3 mb-3">
              <label for="rating" class="form-label fw-bold"> Rating </label>

              <select id="rating" class="form-select" required>
                <option value="">Select rating</option>
                <option value="1">1 ⭐</option>
                <option value="2">2 ⭐⭐</option>
                <option value="3">3 ⭐⭐⭐</option>
                <option value="4">4 ⭐⭐⭐⭐</option>
                <option value="5">5 ⭐⭐⭐⭐⭐</option>
              </select>
            </div>

            <!-- Comment -->
            <div class="col-md-6 mb-3">
              <label for="commentText" class="form-label fw-bold">
                Comment
              </label>

              <textarea
                id="commentText"
                class="form-control"
                rows="2"
                required
              ></textarea>
            </div>
          </div>

          <button type="submit" class="btn btn-dark btn-sm">Update</button>
        </form>
      </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Edit feedback JS -->
    <script src="/js/feedback-edit.js"></script>
  </body>
</html>
